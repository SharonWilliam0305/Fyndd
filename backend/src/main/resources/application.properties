spring.application.name=fyndd
spring.datasource.url=jdbc:h2:file:./data/fyndd;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.error.include-message=never
app.jwt-secret=${JWT_SECRET:local-only-fyndd-secret-change-before-deployment-2026}
app.cors-origin=${CORS_ORIGIN:http://localhost:5173}
app.seed=${SEED_DEMO:true}
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
llm.key=${LLM_API_KEY:}
llm.url=${LLM_API_URL:https://api.openai.com/v1/chat/completions}
llm.model=${LLM_MODEL:gpt-4.1-mini}
server.port=${PORT:8090}

